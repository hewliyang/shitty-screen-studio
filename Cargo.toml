[package]
name = "shitty-screen-studio"
version = "0.1.2"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", features = ["font-kit", "runtime_shaders"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
smallvec = "1"
tiny-skia = "0.11"
dirs = "5"
futures = "0.3"

[features]
snapshot = ["gpui/test-support", "gpui_platform/test-support"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSFormatter", "NSError", "NSString", "NSProcessInfo", "NSURL", "NSValue"] }
objc2-core-foundation = { version = "=0.3.2" }
objc2-core-text = { version = "=0.3.2" }
objc2-core-graphics = { version = "=0.3.2", features = ["CGColorSpace", "CGDirectDisplay", "CGDisplayStream", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-media = { version = "=0.3.2", features = ["CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBufferPool", "objc2-metal"] }
objc2-metal = { version = "=0.3.2" }
objc2-app-kit = { version = "=0.3.2" }
raw-window-handle = "0.6"
core-video = "0.5.2"
core-foundation = "0.10"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVAssetWriter", "AVAssetWriterInput", "AVMetadataItem", "AVMetadataIdentifiers", "AVAsset", "AVAssetTrack", "AVComposition", "AVCompositionTrack", "AVAssetReader", "AVAssetReaderOutput", "AVMediaFormat", "AVVideoSettings", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVPlayer"] }
objc2-screen-capture-kit = { version = "=0.3.2", features = ["block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "SCShareableContent", "SCStream", "SCError", "std"] }

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
