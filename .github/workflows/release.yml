name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bundle app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION=0.0.0-dev
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DEST="$RUNNER_TEMP/dmg" VERSION="$VERSION" scripts/bundle.sh

      - name: Make DMG
        run: |
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Shitty Screen Studio" -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "Shitty-Screen-Studio-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: "*.dmg"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.dmg --title "$GITHUB_REF_NAME" --generate-notes
